name: g2p
channels:
  - pytorch
  - nvidia/label/cuda-12.4.1
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cuda
  - conda-forge::cudnn
  - gcc=13.2
  - gxx=13.2
  - pytorch=2.5.0
  - torchvision=0.20.0
  - torchaudio=2.5.0
  - pytorch-cuda=12.4
  - ninja
  - google-sparsehash
  - pyyaml
  - tensorboard
  - tensorboardx
  - yapf
  - addict
  - scipy
  - plyfile
  - termcolor
  - timm
  - regex
  - tqdm
  - open3d
  - pip:
    - --find-links https://data.pyg.org/whl/torch-2.5.0+cu124.html
    - torch-scatter
    - spconv-cu124
    - git+https://github.com/Dao-AILab/flash-attention.git
    - ./libs/pointops
